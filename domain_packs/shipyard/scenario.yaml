# 데모 시나리오 입력. task로 seed하지 않는다.
# 시간은 10/12 09:00 기준 정수 분(1440분 = 하루). 화면의 시연값은 /api/dev/scenario로 여기서 읽는다.
# 신규 작업 A: Planner A의 B구역 인양 요청.
new_task:
  task_id: A
  label: 크레인 인양 (Scene 1–3)
  unit_id: UA
  owner_actor_id: planner_a
  work_type: LIFTING
  zone_id: B
  duration: 30
  earliest_start: 0             # 09:00
  latest_start: 60              # 10:00
  latest_end: 90                # 10:30
  required_resource_type: CRANE
  requested_resource_id: A-CR-01
  predecessors: []
  movable: { time: true, resource: false }   # 자원 축 미확인
  requested: { start: 0, end: 30 }           # 요청 일정 09:00–09:30

# 시연 확장 요청 (가정). 요청자(requester)가 Unit·담당자를 정한다. 하나씩 확정한 뒤 다음을 보낸다.
# 기대 결과(L0, 변경 수, 달력/근무 지연)는 backend/scripts/verify_demo_values.py로 다시 계산한다.
demo_requests:
  - task_id: N1                 # CAP-RESOURCE (K) → 10/13 11:00, 변경 1, 지연 60/60
    label: 장비 이중 배정
    requester: planner_a
    work_type: LIFTING
    zone_id: F
    duration: 60
    earliest_start: 1500        # 10/13(화) 10:00
    latest_start: 1740          # 10/13(화) 14:00
    latest_end: 1800            # 10/13(화) 15:00
    required_resource_type: GANTRY
    requested_resource_id: SITE-GC-01

  - task_id: N2                 # SEP-HOT-FLAM (P) → 10/13 11:15, 변경 1, 지연 45/45
    label: 화기–도장 분리
    requester: planner_a
    work_type: HOT_WORK
    zone_id: G
    duration: 60
    earliest_start: 1530        # 10/13(화) 10:30
    latest_start: 1620          # 10/13(화) 12:00
    latest_end: 1680            # 10/13(화) 13:00
    required_resource_type: null
    requested_resource_id: null

  - task_id: N3                 # CAP-RESOURCE (Q) + SEP-LIFT-BELOW (M) → 10/14 11:00, 변경 1, 지연 120/120
    label: 충돌 2건
    requester: planner_b
    work_type: LIFTING
    zone_id: H
    duration: 60
    earliest_start: 2880        # 10/14(수) 09:00
    latest_start: 3240          # 10/14(수) 15:00
    latest_end: 3300            # 10/14(수) 16:00
    required_resource_type: GANTRY
    requested_resource_id: SITE-GC-01

  - task_id: N4                 # SEP-HOT-FLAM (W) → 10/14 09:00 (다음 날), 변경 1, 지연 1140/180
    label: 다음 날 이동
    requester: planner_a
    work_type: HOT_WORK
    zone_id: G
    duration: 120
    earliest_start: 1740        # 10/13(화) 14:00
    latest_start: 3060          # 10/14(수) 12:00
    latest_end: 3180            # 10/14(수) 14:00
    required_resource_type: null
    requested_resource_id: null

  - task_id: N5                 # (선택, 마지막) SEP-LIFT-BELOW (K) → 모든 범위 INFEASIBLE → 이관 → 철회
    label: 해 없음·이관 (선택)
    requester: planner_b
    work_type: WORK_BELOW
    zone_id: F
    duration: 60
    earliest_start: 1470        # 10/13(화) 09:30
    latest_start: 1500          # 10/13(화) 10:00
    latest_end: 1560            # 10/13(화) 11:00
    required_resource_type: null
    requested_resource_id: null

# 지연 신고 시연 문구 (Scene 4). 대상 없음 → SITE Hold.
# answer는 Event Response가 시각을 되물으면(ASK_REPORTER) 신고자가 답하는 문장이다.
demo_events:
  - { label: 도장 지연 신고, event_type: DELAY, text: "도장 준비 15분 늦어져 10시부터", target_task_id: null }
  - { label: 도장 추가 지연, event_type: DELAY, text: "도장 또 늦어진대요", target_task_id: null, answer: "도장 준비가 10시 15분부터 됩니다" }

# 구조화 거절 시연값 (Scene 3 기본안 B). 화면의 거절 "시연값 채우기"가 쓴다.
demo_rejections:
  - { label: C 작업 고정, reason_code: TASK_IMMOVABLE, target_task_ids: [C], axes: [TIME, RESOURCE], comment: "작업발판 연계 공정 확정" }

# 자연어 작업 요청 시연값 (Work Intake). 명확한 요청은 new_task A와 같은 값이다.
# answer는 모호한 요청에서 확인 질문을 받으면 요청자가 답하는 문장이다(live run·테스트의 사람 역할).
demo_intakes:
  - label: 자연어 요청(명확)
    requester: planner_a
    task_id: A
    text: "B구역 인양 30분, A-CR-01 크레인으로 해 주세요. 첫날 9시에서 10시 사이에 시작하고 10시 반까지 끝나야 합니다."
    answer: ""
  - label: 자연어 요청(모호)
    requester: planner_a
    task_id: A
    text: "인양 작업 30분 잡아 주세요. 첫날 9시에서 10시 사이 시작, 10시 반까지는 끝나야 해요."
    answer: "B구역이고, 우리 A-CR-01 크레인을 씁니다."
