# shipyard Rule (설계서 §5.3, 데모 정책 수치). min_gap은 분.
rules:
  - { rule_id: SEP-LIFT-BELOW, type: SEPARATION, hazard_a: LIFTING,  hazard_b: WORK_BELOW, relations: [SAME, BELOW],    min_gap: 0 }
