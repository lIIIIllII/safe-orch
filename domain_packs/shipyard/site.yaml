# shipyard 현장.
# 시간은 Horizon 원점(10/12 09:00) 기준 정수 분, 1440분 = 하루. 날짜·시각 문자열은 따옴표로 감싼다.
site_id: YARD-01                            # 가정
# Replanning System prompt의 현장 설명. 한 줄, 100자 이하, 중괄호 금지.
# Horizon 원점 시각은 따로 두지 않고 horizon_start_utc + timezone으로 계산한다.
site_description: "여러 협력사가 구역·크레인·시간을 나눠 쓰는 현장"
timezone: "Asia/Seoul"                      # IANA. 화면의 날짜·시각 변환용
horizon_start_utc: "2026-10-12T00:00:00Z"   # = 10/12(월) 09:00 KST, 가정
horizon_minutes: 3360                       # 10/12(월) 09:00 – 10/14(수) 17:00
currency: KRW                               # 자원 cost_per_hour의 화폐 단위

# 근무 달력(가정). 작업 [start, end)는 근무 구간 하나 안에 있어야 한다(기본 제약 CALENDAR).
# 0 ≤ lo < hi ≤ horizon, 시작 순, 겹치거나 맞닿지 않음.
work_intervals:
  - [0, 480]                                # 10/12(월) 09:00–17:00
  - [1440, 1920]                            # 10/13(화) 09:00–17:00
  - [2880, 3360]                            # 10/14(수) 09:00–17:00

# name·unit_type은 가정(unit_type은 표시용 라벨)
units:
  - { unit_id: UA,   name: 협력사 A,  unit_type: SUBCONTRACTOR }
  - { unit_id: UB,   name: 협력사 B,  unit_type: SUBCONTRACTOR }
  - { unit_id: SITE, name: 현장 운영, unit_type: SITE_OFFICE }

actors:
  - { actor_id: planner_a,  name: Planner A,  unit_id: UA,   roles: [UNIT_PLANNER] }  # A 담당·요청자
  - { actor_id: foreman_a2, name: Foreman A2, unit_id: UA,   roles: [] }              # C 담당. 권한은 담당 관계로만
  - { actor_id: planner_b,  name: Planner B,  unit_id: UB,   roles: [UNIT_PLANNER] }  # B·D·E 담당
  - { actor_id: reporter,   name: Reporter,   unit_id: SITE, roles: [REPORTER] }      # unit 가정
  - { actor_id: supervisor, name: Supervisor, unit_id: SITE, roles: [SUPERVISOR] }    # unit 가정

# F·G·G2·H는 시연 확장 구역(가정). 기존 B·C·D·D2와 관계를 두지 않는다.
zones: [B, C, D, D2, F, G, G2, H]

# SAME은 선언하지 않는다(같은 zone이면 자동). ADJACENT는 zones: [a, b](대칭),
# BELOW는 { relation: BELOW, upper: <zone>, lower: <zone> }로만 선언한다.
zone_relations:
  - { relation: ADJACENT, zones: [D, D2] }
  - { relation: ADJACENT, zones: [G, G2] }  # 가정

# available_intervals [[0, 3360]]은 가정. 야간은 근무 달력(CALENDAR)이 막는다.
# SITE-GC-01(골리앗 크레인, 가정)은 두 협력사 공용이다. 유형을 CRANE과 나눠 A 장면의 자원 조회에 섞이지 않게 한다.
# allowed_zone_ids(사용 가능 구역)는 필수다. 모든 구역이면 "*"로 적는다. 없으면 로더가 거절한다.
# attributes는 pack.yaml resource_attributes에 선언된 속성의 값이다.
# display_name·cost_per_hour·note는 가정값이다. cost_per_hour(currency 단위)는 데이터만 두고 계산·판정에 쓰지 않는다.
resources:
  - { resource_id: A-CR-01,    display_name: A사 이동식 크레인 1호,  resource_type: CRANE,  owner_unit_id: UA,   allowed_unit_ids: [UA],     allowed_zone_ids: [B, C],    capacity: 1, available_intervals: [[0, 3360]], attributes: { max_load: 25,  usage: [일반]       }, cost_per_hour: 150000, note: "" }
  - { resource_id: SITE-CR-01, display_name: 현장 공용 크레인 1호,   resource_type: CRANE,  owner_unit_id: SITE, allowed_unit_ids: [UA],     allowed_zone_ids: [B, C, D], capacity: 1, available_intervals: [[0, 3360]], attributes: { max_load: 50,  usage: [일반]       }, cost_per_hour: 220000, note: "" }
  - { resource_id: B-CR-01,    display_name: B사 이동식 크레인 1호,  resource_type: CRANE,  owner_unit_id: UB,   allowed_unit_ids: [UB],     allowed_zone_ids: [B, D],    capacity: 1, available_intervals: [[0, 3360]], attributes: { max_load: 25,  usage: [일반]       }, cost_per_hour: 150000, note: "" }
  - { resource_id: SITE-GC-01, display_name: 안벽 골리앗 크레인 1호, resource_type: GANTRY, owner_unit_id: SITE, allowed_unit_ids: [UA, UB], allowed_zone_ids: [F, H],    capacity: 1, available_intervals: [[0, 3360]], attributes: { max_load: 300, usage: [블록, 일반] }, cost_per_hour: 900000, note: "안벽 레일 구간 전용" }

# 수량 풀. kind는 pack.yaml pool_kinds에 있어야 한다. allowed_unit_ids를 생략하면 소유 Unit만 쓴다.
# 한 Unit이 한 종류에 쓸 수 있는 풀은 하나다(작업이 쓸 풀이 하나로 정해진다). 수량·단가는 가정값이고,
# cost_per_hour(1단위·시간당, currency 단위)는 데이터만 두고 계산·판정에 쓰지 않는다.
pools:
  - { pool_id: UA-SIG, kind: SIGNALER, display_name: A사 신호수,    owner_unit_id: UA, quantity: 2,  cost_per_hour: 35000 }
  - { pool_id: UA-WRK, kind: WORKER,   display_name: A사 작업 인원, owner_unit_id: UA, quantity: 10, cost_per_hour: 30000 }
  - { pool_id: UB-SIG, kind: SIGNALER, display_name: B사 신호수,    owner_unit_id: UB, quantity: 1,  cost_per_hour: 35000 }
  - { pool_id: UB-WRK, kind: WORKER,   display_name: B사 작업 인원, owner_unit_id: UB, quantity: 10, cost_per_hour: 30000 }
