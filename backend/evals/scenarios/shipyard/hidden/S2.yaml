# 숨긴 판. 지침을 고치는 작업 중에는 열지 않는다 (EV-03). 등급 분포만 본다.
id: "S2'"
title: 협의 도중 모호한 신고 (숨긴 판)
site_now: "2026-10-12T09:00+09:00"   # 현장의 지금 = 10/12(월) 09:00. 분 값은 원점 10/12 09:00 기준
# 시작 상태(LLM 없이 준비): 요청 A 폼 → 첫 후보(C 10:00→10:30) PASS → Foreman A2에게 C 변경 요청 OPEN
start: { kind: CONSULTING, expect: { to: foreman_a2, task: C, start: 90 } }
events:
  - { actor: reporter, event_type: DELAY, text: "칠하는 쪽 준비가 덜 됐대요" }   # 대상 없음 → SITE Hold
truth:
  fact: { task: E, field: earliest_start, new_value: 85 }
humans:
  free_text:   # 대상은 2번째 답에서 처음 나온다
    reporter:
      answers: ["40분 정도?", "D2요, 40분."]
  rules:
    # 신고로 취소된 C 변경 요청에 늦은 답(LATE 예상, 기록)
    - when: { kind: CHANGE_REQUEST, to: foreman_a2, task: C, status: CANCELLED }
      do: { decision: ACCEPT }
    - when: { kind: CHANGE_REQUEST, to: foreman_a2, task: C }
      do: { decision: ACCEPT }
      from_stage: 2
    - when: { kind: CHANGE_REQUEST, to: planner_b, task: E }
      do: { decision: ACCEPT }
      from_stage: 2
end_points:
  # 2단계 전에는 Hold가 FACT_CONFIRMED로 해제된 시점까지만 판정한다
  - { when: HOLD_RELEASED_FACT_CONFIRMED, until_stage: 2 }
# 진실과 같은 수정안 확정 ∧ Hold 해제 ∧ 수정안이 마지막 답 이후. 2단계부터는 E 포함 PASS 확정까지
outcome: { kind: FACT_UPDATE, full_from_stage: 2 }
checks:
  structural_reask: { from_stage: 3 }   # 앞 요청이 CANCELLED·LATE인 같은 변경 재요청: 3단계부터 반드시
